name: recent.design discovery (original sources)
# Watches https://recent.design/sitemap.xml for new entries, traces each to its ORIGINAL source
# (X post via public fxtwitter / oEmbed APIs, official site / repo), stores metadata only.
on:
  schedule:
    - cron: '41 1,13 * * *'   # every 12 h (09:41 / 21:41 Shanghai); recent.design adds a few entries per day
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Max new entries per run'
        default: '60'
permissions:
  contents: write
concurrency: { group: daily-update, cancel-in-progress: false }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Discover + trace originals (append-only, deduped)
        env:
          RD_MAX_NEW: ${{ github.event.inputs.max_new || '60' }}
        run: pip install -q markdown && python3 scripts/recent_design.py
      - name: Split data for the first screen (split/*.js + index.html hash map)
        run: python3 scripts/split_data.py
      - name: Commit
        run: |
          git config user.name "ui-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A split data.json data.js media.js data api llms.txt llms-full.txt sitemap*.xml index.html AGENTS.md agents blog .well-known robots.txt ui-hub-skill ui-hub-skill.zip kb context-bundle.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: recent.design discovery $(date -u +%F' '%H:%M) (original sources)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            # data files conflicted with a concurrent push: start from the new main and regenerate (script is idempotent)
            git rebase --abort || true; git reset -q --hard origin/main
            python3 scripts/recent_design.py
            python3 scripts/split_data.py
            git add -A split data.json data.js media.js data api llms.txt llms-full.txt sitemap*.xml index.html AGENTS.md agents blog .well-known robots.txt ui-hub-skill ui-hub-skill.zip kb context-bundle.md
            git diff --cached --quiet && exit 0
            git commit -m "chore: recent.design discovery $(date -u +%F' '%H:%M) (original sources)"
          done; exit 1
