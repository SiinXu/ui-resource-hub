name: Awwwards Archive discovery (original sites)
# Watches https://awwwards.withseismic.com/feed.xml for new Awwwards Site of the Day winners and traces each
# to the winning site itself (url), its studio credit and its awwwards.com/sites page; metadata only.
on:
  schedule:
    - cron: '23 3 * * *'   # daily 03:23 UTC (SOTD is announced once a day)
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Max new entries per run'
        default: '40'
permissions:
  contents: write
concurrency: { group: daily-update, cancel-in-progress: false }
jobs:
  awwwards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Discover SOTD winners + trace originals (append-only, deduped)
        env:
          AW_MAX_NEW: ${{ github.event.inputs.max_new || '40' }}
        run: pip install -q markdown && python3 scripts/awwwards_archive.py
      - name: Split data for the first screen (split/*.js + index.html hash map)
        run: python3 scripts/split_data.py
      - name: Commit
        run: |
          git config user.name "ui-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A split data.json data.js media.js data api llms.txt llms-full.txt sitemap*.xml index.html AGENTS.md agents blog .well-known robots.txt ui-hub-skill ui-hub-skill.zip kb context-bundle.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: awwwards archive discovery $(date -u +%F' '%H:%M) (original sources)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            # data files conflicted with a concurrent push: start from the new main and regenerate (script is idempotent)
            git rebase --abort || true; git reset -q --hard origin/main
            python3 scripts/awwwards_archive.py
            python3 scripts/split_data.py
            git add -A split data.json data.js media.js data api llms.txt llms-full.txt sitemap*.xml index.html AGENTS.md agents blog .well-known robots.txt ui-hub-skill ui-hub-skill.zip kb context-bundle.md
            git diff --cached --quiet && exit 0
            git commit -m "chore: awwwards archive discovery $(date -u +%F' '%H:%M) (original sources)"
          done; exit 1
