name: Daily UI resource update
on:
  schedule:
    - cron: '17 0 * * *'   # 00:17 UTC daily (08:17 Shanghai)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: daily-update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Harvest new resources (append-only) and rebuild extras
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          MAX_NEW: '15'
        run: python3 scripts/daily_update.py
      - name: Commit
        run: |
          git config user.name "ui-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json data.js api llms.txt llms-full.txt sitemap.xml index.html AGENTS.md agents blog .well-known robots.txt ui-hub-skill ui-hub-skill.zip
          git diff --cached --quiet && echo "no changes" || (git commit -m "chore: daily UI resource update $(date -u +%F)" && git push)
